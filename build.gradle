plugins {
   id 'java'
   id 'application'
   id 'pmd'
   id 'org.ajoberstar.git-publish' version '4.2.0'
}
pmd {
    consoleOutput = true
    toolVersion = '7.16.0'
    rulesMinimumPriority = 5
    ruleSets = [
        'category/java/errorprone.xml',
        'category/java/bestpractices.xml'
    ]
    ignoreFailures = true
}

tasks.named('pmdTest') {
    enabled = false
}

tasks.withType(Pmd).configureEach {
    reports {
        xml.required = false
        html.required = true
    }
}
repositories {
    mavenCentral()
}


java {
    sourceCompatibility = JavaVersion.toVersion(11)
    targetCompatibility = JavaVersion.toVersion(11)
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.7.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.hamcrest:hamcrest-library:2.2'
}

tasks.withType(Test) {
    useJUnitPlatform()
    ignoreFailures = true
    testLogging {
        events "passed", "skipped", "failed"
        }
}

application { //Allows  ./gradlew run --args=path-to-test-data
    mainClass = 'edu.odu.cs.MostCommonWords'
}

tasks.register('copyHtml', Copy) {
    from 'src/main/html'
    into 'build/reports'
}

tasks.register('copyDocs', Copy) {
    dependsOn javadoc
    from 'build/docs'
    into 'build/reports'
}

tasks.register('reports') {
    dependsOn build
    dependsOn copyHtml
    dependsOn copyDocs
    dependsOn pmdMain
}

gitPublish {
    repoUri = 'git@github.com:ODU-CS351-F26/CS351--ciAsst--AfrazMKhan.git'
    branch = 'gh-pages'

    contents {
        from 'build/reports'
    }
}

tasks.register('deployReports') {
    dependsOn reports
    dependsOn gitPublishPush
}

gitPublishCopy.dependsOn reports

